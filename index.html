  <script>
    (function () {
      const targetUrl = 'https://wa.me/+5493435086931/?text=Hola%20Ingrid%20,%20quiero%20confirmar%20mi%20asistencia';
      const apply = () => {
        const section = document.querySelector('[data-editor-type="assist"]');
        if (!section) return false;

        const button = Array.from(section.querySelectorAll('button, a'))
          .find((el) => /confirmar|confirm/i.test((el.textContent || '').trim()));

        if (!button) return false;

        button.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          window.open(targetUrl, '_blank', 'noopener,noreferrer');
        });

        return true;
      };

      if (!apply()) {
        const observer = new MutationObserver(function () {
          if (apply()) {
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(function () {
          observer.disconnect();
        }, 5000);
      }
    })();
  </script>
  <script>
    (function () {
      const blockText = `Evitar:\n- Escotes pronunciados\n- Remeras cortas (crop tops)\n- Espaldas muy descubiertas\n- Prendas por encima de la rodilla`;

      function injectIntoDialog(dialog) {
        if (!dialog || dialog.dataset.dresscodeInjected === 'true') return;

        const wrapper = document.createElement('div');
        wrapper.style.marginBottom = '16px';
        wrapper.style.fontSize = '1rem';
        wrapper.style.lineHeight = '1.5';
        wrapper.innerHTML = `
          <div style="font-weight: 700; margin-bottom: 8px;">Evitar:</div>
          <div style="white-space: pre-line;">${blockText.replace('Evitar:\n', '')}</div>
        `;

        const firstChild = dialog.firstElementChild;
        if (firstChild) {
          dialog.insertBefore(wrapper, firstChild);
        } else {
          dialog.appendChild(wrapper);
        }

        dialog.dataset.dresscodeInjected = 'true';
      }

      function getDressCodeDialog(section) {
        const candidates = [];
        if (section) {
          candidates.push(...Array.from(section.querySelectorAll('dialog')));
          if (section.parentElement) {
            candidates.push(...Array.from(section.parentElement.querySelectorAll('dialog')));
          }
        }
        candidates.push(...Array.from(document.querySelectorAll('dialog')));

        return candidates.find((dialog) => dialog.open) || null;
      }

      document.addEventListener('click', function (event) {
        const button = event.target.closest('button, a');
        if (!button || !/importante/i.test((button.textContent || '').trim())) return;

        const section = button.closest('[data-editor-type="dressCode"]');
        if (!section) return;

        setTimeout(function () {
          const dialog = getDressCodeDialog(section);
          if (dialog) injectIntoDialog(dialog);
        }, 80);
      }, true);

      const observer = new MutationObserver(function () {
        document.querySelectorAll('dialog').forEach(function (dialog) {
          if (dialog.open && dialog.dataset.dresscodeInjected !== 'true') {
            const section = dialog.closest('[data-editor-type="dressCode"]');
            if (section) {
              injectIntoDialog(dialog);
            }
          }
        });
      });

      observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['open'] });
    })();
  </script>
